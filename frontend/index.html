<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="On-page SEO analysis: scores, checks and recommendations for any public URL." />
    <meta name="theme-color" content="#ffffff" />
    <title>SEO Analysis</title>
    <!--
      Paint the right palette on the first frame.

      This runs before the stylesheet resolves and before React mounts, which is
      the only place it can run without the page appearing white for a moment on
      the way to dark. It is deliberately tiny and deliberately not a module, so
      it is not deferred. The key here is the one in src/theme/ThemeContext.tsx.
    -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('seo-theme')
          var dark =
            saved === 'dark' ||
            ((saved === null || saved === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.classList.add('dark')
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute('content', '#0b0b0e')
          }
        } catch (e) {
          /* No stored choice readable: the light default below stands. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
