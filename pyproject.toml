[project]
name = "seo"
version = "0.1.0"
description = "On-page SEO analysis API with site audits, PageSpeed Insights and per-user quotas"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.125.0",
    "uvicorn[standard]==0.38.0",
    "python-multipart==0.0.20",
    "pydantic-settings==2.7.0",
    "email-validator==2.3.0",
    "asyncmy==0.2.10",
    "PyMySQL==1.1.2",
    "alembic==1.14.0",
    "PyJWT==2.10.1",
    "bcrypt==5.0.0",
    "cryptography==50.0.1",
    "arq==0.26.3",
    "httpx[http2]==0.28.1",
    "brotli==1.2.0",
    "zstandard==0.25.0",
    "beautifulsoup4==4.14.3",
    "lxml==5.3.0",
    "Markdown==3.7",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "pytest-cov==6.0.0",
    "respx==0.22.0",
    "aiosqlite==0.20.0",
    "ruff==0.9.2",
    "mypy==1.15.0",
    "types-Markdown==3.7.0.20241204",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's async layer runs DB calls in greenlets; without this, code that
# follows an awaited query is reported as uncovered.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 70

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
extend-select = ["B", "ASYNC", "RUF006"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
