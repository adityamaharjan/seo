# Same-origin front door for seo.hakezlabs.qzz.io.
#
# The browser sees one origin. nginx serves the built frontend at / and hands
# the API paths to uvicorn on :8001, so the app calls relative URLs like
# /api/v1/analyses and no CORS headers are involved at all.
#
# Point the Cloudflare tunnel's public hostname for seo.hakezlabs.qzz.io at
# http://127.0.0.1:8002 instead of :8001 once this is enabled.
#
# Install:
#   sudo cp deploy/nginx-seo.conf /etc/nginx/sites-available/seo
#   sudo ln -sf /etc/nginx/sites-available/seo /etc/nginx/sites-enabled/seo
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 127.0.0.1:8002;
    server_name seo.hakezlabs.qzz.io;

    root /var/www/seo/frontend/dist;
    index index.html;

    # Uploaded pages are analyzed, not stored, so request bodies stay tiny.
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- API and the API's own pages go to uvicorn ---------------------------
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The rate limiter reads the first entry, which cloudflared sets to the
        # real client address. Appending keeps that entry first.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location ^~ /documentation {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # --- Static frontend ----------------------------------------------------
    # Vite fingerprints these filenames, so they can be cached forever.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
